[project]
name = "aurorafox"
version = "0.1.0"
description = "On-demand aurora visibility watch for northern Europe"
readme = "README.md"
authors = [
    { name = "joonatanlaulainen", email = "165732566+joonatan-altrove@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "ephem>=4.2,<5",
]

[project.scripts]
aurora-watch = "aurorafox.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is offline and deterministic. Opt into the live smoke tests
# with `uv run pytest -m live` when you want to check upstream payload shapes.
addopts = "-m 'not live'"
markers = ["live: hits the real NOAA/MET APIs"]
